# Nginx 配置模板 - 智枢 AI SaaS 系统
# 在线网页版已下线（产品形态：桌面安装版 + APK）
# 实际生效配置见 deploy/nginx/zhishuai.conf

# 桌面版安装包下载 + API 服务
server {
    listen 80;
    server_name baizhiji.net www.baizhiji.net;

    # 桌面版安装包下载目录
    location /downloads/ {
        alias /var/www/zhishuai/downloads/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        location ~* \.(apk|exe|msi|zip|dmg|AppImage|deb|rpm)$ {
            add_header Content-Disposition "attachment" always;
        }

        location ~* \.json$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            if ($request_method = 'OPTIONS') {
                add_header Content-Length 0;
                return 204;
            }
        }
    }

    # 网页版已下线，根路径返回下线提示
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智枢AI</title></head><body style="font-family:sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0"><div style="text-align:center;padding:40px"><h1 style="color:#1677ff;margin-bottom:12px">智枢AI</h1><p style="color:#666">在线网页版已下线，请下载桌面安装版使用。</p><p><a href="/downloads/" style="color:#1677ff">前往下载中心</a></p></div></body></html>';
    }

    # API 反向代理 - 将 /api/* 转发到后端服务
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# API 子域
server {
    listen 80;
    server_name api.baizhiji.net;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
