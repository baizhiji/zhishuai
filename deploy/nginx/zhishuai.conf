# API 服务
server {
    listen 80;
    server_name api.baizhiji.net;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# IP 地址访问
server {
    listen 80;
    server_name 150.109.60.130;

    # 网页版已下线（产品形态：桌面安装版 + APK），根路径返回下线提示
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智枢AI</title></head><body style="font-family:sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0"><div style="text-align:center;padding:40px"><h1 style="color:#1677ff;margin-bottom:12px">智枢AI</h1><p style="color:#666">在线网页版已下线，请下载桌面安装版使用。</p><p><a href="/downloads/" style="color:#1677ff">前往下载中心</a></p></div></body></html>';
    }

    # 桌面版安装包下载目录
    location /downloads/ {
        alias /var/www/zhishuai/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        location ~* \.(exe|msi|zip|dmg|AppImage|deb|rpm)$ {
            add_header Content-Disposition "attachment" always;
        }
        location ~* \.json$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
        }
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 域名访问 (baizhiji.net, www.baizhiji.net) - 网页版已下线，保留 API、下载目录
server {
    listen 80;
    server_name baizhiji.net www.baizhiji.net;

    # 桌面版安装包下载目录
    location /downloads/ {
        alias /var/www/zhishuai/downloads/;

        # 大文件下载优化
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # 文件列表（内测期方便查看，正式发布建议关闭：autoindex off;）
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # .exe/.msi 等安装包强制作为附件下载
        location ~* \.(exe|msi|zip|dmg|AppImage|deb|rpm)$ {
            add_header Content-Disposition "attachment" always;
        }

        # latest.json 允许跨域，供 tauri updater 读取
        location ~* \.json$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            if ($request_method = 'OPTIONS') {
                add_header Content-Length 0;
                return 204;
            }
        }
    }

    # 网页版已下线（产品形态：桌面安装版 + APK），根路径返回下线提示
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智枢AI</title></head><body style="font-family:sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0"><div style="text-align:center;padding:40px"><h1 style="color:#1677ff;margin-bottom:12px">智枢AI</h1><p style="color:#666">在线网页版已下线，请下载桌面安装版使用。</p><p><a href="/downloads/" style="color:#1677ff">前往下载中心</a></p></div></body></html>';
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
