# 域名访问 (baizhiji.net, www.baizhiji.net) - Web 管理端已下线，保留 API、下载与分享落地页
server {
    listen 80;
    server_name baizhiji.net www.baizhiji.net;

    # 桌面版安装包下载目录
    location /downloads/ {
        alias /var/www/zhishuai/downloads/;

        # 大文件下载优化
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # 文件列表（内测期方便查看，正式发布建议关闭：autoindex off;）
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # .exe/.msi 等安装包强制作为附件下载
        location ~* \.(exe|msi|zip|dmg|AppImage|deb|rpm)$ {
            add_header Content-Disposition "attachment" always;
        }

        # latest.json 允许跨域，供 tauri updater 读取
        location ~* \.json$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            if ($request_method = 'OPTIONS') {
                add_header Content-Length 0;
                return 204;
            }
        }
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
