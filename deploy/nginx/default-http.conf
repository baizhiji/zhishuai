# HTTP 80 默认服务器（IP 直访 / 未知 Host）：下线提示页 + API 代理 + 上传目录
# 原 baizhuji.net（拼写错误遗留配置）的 80 default_server 职责，已统一到 baizhiji.net 体系
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /uploads/ {
        alias /var/www/zhishuai/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # 在线网页版已下线（产品形态：桌面安装版 + APK），此处返回下载引导
    location / {
        default_type text/html;
        charset utf-8;
        return 200 '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>智枢AI</title></head><body style="font-family:sans-serif;text-align:center;padding-top:20vh"><h1>智枢AI</h1><p>在线网页版已下线，请下载桌面安装版使用。</p></body></html>';
    }
}
