name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, server, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci 2>/dev/null || npm install
      - name: TypeScript Check
        if: matrix.project != 'shared'
        run: |
          cd ${{ matrix.project }}
          npx tsc --noEmit
      - name: Lint
        run: |
          cd ${{ matrix.project }}
          npm run lint 2>/dev/null || echo "No lint script"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, server, apk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci 2>/dev/null || npm install
      - name: npm audit
        continue-on-error: true
        run: |
          cd ${{ matrix.project }}
          npm audit --audit-level=high

  build:
    name: Build
    needs: [lint-and-typecheck, security-audit]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci 2>/dev/null || npm install
      - name: Build
        run: |
          cd ${{ matrix.project }}
          npm run build

  desktop-build:
    name: Desktop Build (Windows Installer)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps (skip on Windows)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build Web Static Export
        run: |
          cd web
          npm ci 2>/dev/null || npm install
          npm run build
      - name: Install Desktop Dependencies
        working-directory: desktop
        run: |
          npm ci 2>/dev/null || npm install
      - name: Build & Package Desktop
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置，跳过签名（自动更新不可用，仅产出可安装包）"
            $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json -Depth 20
            $conf.plugins.PSObject.Properties.Remove('updater')
            $conf | ConvertTo-Json -Depth 20 | Set-Content 'src-tauri/tauri.conf.json' -Encoding UTF8
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY 已配置，将生成签名安装包（自动更新可用）"
          }
          npx tauri build
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhishuai-desktop-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  deploy:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_KEY }}
          script: |
            cd /var/www/zhishuai
            git pull origin main
            cd web && npm ci && npm run build && pm2 restart zhishuai-web
            cd ../server && npm ci && npx prisma generate && npx prisma db push --skip-generate && npm run build && pm2 restart zhishuai-api
            cd ../scripts && bash verify-login.sh
