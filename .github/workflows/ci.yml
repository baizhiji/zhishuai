name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, server, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci 2>/dev/null || npm install
      - name: TypeScript Check
        if: matrix.project != 'shared'
        run: |
          cd ${{ matrix.project }}
          npx tsc --noEmit
      - name: Lint
        run: |
          cd ${{ matrix.project }}
          npm run lint 2>/dev/null || echo "No lint script"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, server, apk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci 2>/dev/null || npm install
      - name: npm audit
        continue-on-error: true
        run: |
          cd ${{ matrix.project }}
          npm audit --audit-level=high

  build:
    name: Build
    needs: [lint-and-typecheck, security-audit]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci 2>/dev/null || npm install
      - name: Build
        run: |
          cd ${{ matrix.project }}
          npm run build

  desktop-build:
    name: Desktop Build (Windows Installer)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps (skip on Windows)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build Web Static Export
        shell: bash
        run: |
          cd web
          npm ci 2>/dev/null || npm install
          npm run build
      - name: Install Desktop Dependencies
        shell: bash
        working-directory: desktop
        run: |
          npm ci 2>/dev/null || npm install
      - name: Prepare unsigned desktop config (if no signing key)
        working-directory: desktop
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置，移除 updater 插件后构建未签名安装包"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.plugins && c.plugins.updater) delete c.plugins.updater;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
          else
            echo "TAURI_SIGNING_PRIVATE_KEY 已配置，将生成签名安装包"
          fi
      - name: Build & Package Desktop
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          npx tauri build
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhishuai-desktop-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  deploy-desktop:
    name: Deploy Desktop Installer to Server
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [desktop-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: zhishuai-desktop-installer
          path: ./installer
      - name: Ensure downloads directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /var/www/zhishuai/downloads
      - name: Upload installers to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "installer/*"
          target: "/var/www/zhishuai/downloads/"
          strip_components: 1
          overwrite: true

  deploy:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/zhishuai
            # 服务器上可能存在未提交的手工修改，先 stash 再拉取，避免 pull 失败
            git config user.email "ci@zhishuai.ai" || true
            git config user.name "CI Bot" || true
            git stash push -u -m "auto-stash-before-deploy-$(date +%s)" || true
            git pull origin main

            # 后端部署
            cd server
            npm ci 2>/dev/null || npm install
            npx prisma generate
            npx prisma db push --skip-generate
            npm run build
            pm2 restart zhishuai-api
            cd ..

            # 桌面安装包下载目录
            mkdir -p /var/www/zhishuai/downloads

            # 登录验证
            cd scripts && bash verify-login.sh
